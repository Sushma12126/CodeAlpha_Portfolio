<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Sushma Creates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:#fff}
header{padding:60px 20px;text-align:center;background:linear-gradient(135deg,#ff6b6b,#feca57,#ff6b6b);background-size:200% 200%;animation:move 5s infinite}
@keyframes move{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
header img{width:130px;height:130px;border-radius:50%;border:4px solid white;object-fit:cover;box-shadow:0 0 25px #fff;animation:float 3s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
header h1{font-size:38px;margin-top:12px}
header p{opacity:.9;margin-top:6px}
.btn{display:inline-block;margin:15px 8px 0;padding:12px 22px;background:#fff;color:#000;text-decoration:none;border-radius:25px;font-weight:bold}
section{max-width:900px;margin:auto;padding:40px 20px}
h2{font-size:26px;margin-bottom:15px;color:#feca57}
.skills{display:flex;gap:10px;flex-wrap:wrap}
.skills span{background:#22223a;padding:9px 16px;border-radius:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#1a1a2e;padding:20px;border-radius:15px;border:1px solid #333}
.card:hover{border-color:#feca57;transform:translateY(-5px)}
.card h3{margin-bottom:8px}
.card p{color:#aaa;font-size:14px;margin-bottom:12px}
.card a{color:#48dbfb;text-decoration:none;font-weight:bold}
.design-box
