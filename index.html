<title>Keerti Creates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f1a;color:#fff}
header{padding:60px 20px;text-align:center;background:linear-gradient(135deg,#ff6b6b,#feca57)}
header img{width:120px;height:120px;border-radius:50%;border:4px solid white;object-fit:cover}
header h1{font-size:36px;margin-top:12px}
header p{opacity:.9;margin-top:6px}
.btn{display:inline-block;margin:15px 8px 0;padding:12px 22px;background:#fff;color:#000;text-decoration:none;border-radius:25px;font-weight:bold}
section{max-width:900px;margin:auto;padding:40px 20px}
h2{font-size:26px;margin-bottom:15px;color:#feca57}
.skills{display:flex;gap:10px;flex-wrap:wrap}
.skills span{background:#22223a;padding:9px 16px;border-radius:20px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#1a1a2e;padding:20px;border-radius:15px}
.card h3{margin-bottom:8px}
.card p{color:#aaa;font-size:14px;margin-bottom:12px}
